[package]
name = "joy2qlc"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Convert flight joystick input to keypresses or REST calls."
license = "MIT OR Apache-2.0"

[features]
default = ["joystick", "simulate-keys"]
joystick = ["gilrs"]
simulate-keys = ["enigo"]
rest-client = ["reqwest", "tokio"]
rest-server = ["warp", "tokio"]
# Use the modern tray implementation (tray-icon + winit)
tray = ["tray-icon", "winit", "which"]
# MIDI support (uses midir / CoreMIDI on macOS)
midi = ["midir"]
# Optional JACK backend (feature named differently to avoid name collision)
jack-backend = ["jack"]

[dependencies]
# Joystick/gamepad input
gilrs = { version = "0.9", optional = true }

# Key simulation (cross-platform)
enigo = { version = "0.0.14", optional = true }

# HTTP client/server
reqwest = { version = "0.11", optional = true, features = ["json"] }
warp = { version = "0.3", optional = true }

# Async runtime and (de)serialization
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }

# Config / hot-reload
toml = "0.7"
notify = "5.0"
anyhow = "1.0"

# MIDI output (optional)
midir = { version = "0.8", optional = true }
# JACK backend (optional)
jack = { version = "0.6", optional = true }
# small convenience for lazy init
once_cell = "1.17"
# small utility to detect installed CLI tools at runtime
which = { version = "4", optional = true }

# OSC support (send UDP OSC to QLC+ or other OSC listeners)
rosc = "0.6"

# tray implementation (modern crate using winit)
tray-icon = { version = "0.7", optional = true }
winit = { version = "0.28", optional = true }

# image handling (PNG reader to build icon bitmaps)
image = "0.24"

# Logging
log = "0.4"
env_logger = "0.9"

[package.metadata]
# Notes: enable features as needed, for example:
# `cargo run --features "joystick simulate-keys"`
