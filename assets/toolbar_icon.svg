<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <title>joy2qlc joystick</title>
  <!-- Transparent background, white joystick icon suitable as a template status icon -->
  <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- base plate (narrowed ~15%) -->
    <rect x="5.2" y="12" width="13.6" height="6" rx="1.2" />
    <!-- stick stem (lengthened ~15%) -->
    <path d="M12 12 L12 6.25" />
    <!-- knob -->
    <circle cx="12" cy="5" r="2" fill="#ffffff" stroke="none" />
  </g>
</svg>